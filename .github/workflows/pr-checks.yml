name: PR Checks

on:
  pull_request:
    branches: [main]
  # The translate workflow opens PRs with the default workflow token, and
  # GitHub never starts pull_request runs for those. Dispatching this
  # workflow against the PR branch still registers the required "check" on
  # the head commit, so those PRs can satisfy branch protection.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # npm ci requires exact platform-optional-dependency parity with the lock
      # file; that lock file was generated on Windows, so Linux-only optional
      # deps (e.g. Rolldown's WASM fallback) are absent and npm ci fails.
      - run: npm install
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build

  # Shares a video into the built app while a new version is released, in
  # desktop Chrome, and checks the share is never silently lost: the app
  # updates itself with a quiet reload, and returning from a share is when it
  # looks for one. Kept out of the required check above while it settles.
  share-during-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: see the check job above.
      - run: npm install
      - run: npm run build
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: node test/update-during-share.mjs
