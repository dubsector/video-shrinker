name: PR Checks

on:
  pull_request:
    branches: [main]
  # The translate workflow opens PRs with the default workflow token, and
  # GitHub never starts pull_request runs for those. Dispatching this
  # workflow against the PR branch still registers the required "check" on
  # the head commit, so those PRs can satisfy branch protection.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # npm ci requires exact platform-optional-dependency parity with the lock
      # file; that lock file was generated on Windows, so Linux-only optional
      # deps (e.g. Rolldown's WASM fallback) are absent and npm ci fails.
      - run: npm install
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build

      # Converts a video with the build in the runner's own Chrome and checks
      # the result (web-test/convert-test.mjs).
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Convert a video in Chrome
        run: node web-test/convert-test.mjs
      - name: Upload the converted video and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-${{ github.run_number }}
          path: web-test-output/
          if-no-files-found: ignore
          retention-days: 14
