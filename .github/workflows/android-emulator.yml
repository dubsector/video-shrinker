name: Android Emulator Test

# Builds the debug APK and runs android/emulator-test/smoke-test.sh on an
# emulator: launch, share a video in, convert it, and survive being sent to
# the background mid-encode. Then runs the Test Lab share tests
# (android/emulator-test/share-tests.sh) on a fresh emulator. By default the app loads this branch's own web
# build (served locally in place of dubsector.github.io), so a PR is tested
# with its own changes; a manual run can pick the live site instead.
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
    inputs:
      site:
        description: Web app to load in the emulator
        type: choice
        options: [branch, live]
        default: branch

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: emulator (Android ${{ matrix.android }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The Android the app targets (targetSdkVersion, 16) and the one before
    # it, side by side. One failing shouldn't hide whether the other
    # passes. The newer images (36.1, 37.0) can't be used yet: their
    # SurfaceFlinger aborts on "!rcEnc->featureInfo()->hasReadColorBufferDma"
    # whenever it reads the screen back, restarting Android mid-test, at any
    # screen size and with every emulator graphics mode tried.
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: 15
            api-level: '35'
          - android: 16
            api-level: '36'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Caching Gradle's downloads is fine here: this only builds a debug APK
      # for a throwaway emulator. The release build (android-build.yml) never
      # restores a cache, so nothing cached can end up in what ships.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # npm ci can't be used: see pr-checks.yml.
      - name: Build web app
        if: inputs.site != 'live'
        run: npm install && npm run build

      - name: Build debug APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # The hosted Linux runners have KVM, but only root can open it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      # The Play Store image is the one that ships Chrome, which the app needs.
      # Each image bundles the Chrome of its day, so a newer Android also means
      # a newer Chrome. The screen is a Pixel 9 Pro XL's.
      - name: Run smoke test on emulator
        # Booting and both conversions take under 10 minutes; a wedged
        # emulator shouldn't hold the job for the full 45.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          WEB_ROOT: ${{ inputs.site != 'live' && 'dist' || '' }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: bash android/emulator-test/configure-avd.sh
          script: bash android/emulator-test/smoke-test.sh android/app/build/outputs/apk/debug/app-debug.apk

      # The share tests Firebase Test Lab runs on a real phone, here for free:
      # media store, a Google-Photos-like sender, ClipData-only and
      # several-item shares. Run even when the smoke test failed, on a fresh
      # emulator, so one doesn't hide the other.
      # Kept from failing the job while it settles: on Android 15 one share
      # in a run sometimes never reaches the app, a different one each time.
      - name: Run share tests on emulator
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: bash android/emulator-test/configure-avd.sh
          script: bash android/emulator-test/share-tests.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-test-${{ github.run_number }}-android-${{ matrix.android }}
          path: |
            emulator-test-output/*.png
            emulator-test-output/*.txt
            emulator-test-output/*.log
            emulator-test-output/share-tests/
          if-no-files-found: warn
          retention-days: 14
