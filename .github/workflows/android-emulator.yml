name: Android Emulator Test

# Builds the debug APK and runs android/emulator-test/smoke-test.sh on an
# emulator: launch, share a video in, convert it, and survive being sent to
# the background mid-encode. By default the app loads this branch's own web
# build (served locally in place of dubsector.github.io), so a PR is tested
# with its own changes; a manual run can pick the live site instead.
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
    inputs:
      site:
        description: Web app to load in the emulator
        type: choice
        options: [branch, live]
        default: branch

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # npm ci can't be used: see pr-checks.yml.
      - name: Build web app
        if: inputs.site != 'live'
        run: npm install && npm run build

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # The hosted Linux runners have KVM, but only root can open it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      # The Play Store image is the one that ships Chrome, which the app needs.
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          WEB_ROOT: ${{ inputs.site != 'live' && 'dist' || '' }}
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: bash android/emulator-test/smoke-test.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-test-${{ github.run_number }}
          path: |
            emulator-test-output/*.png
            emulator-test-output/*.txt
            emulator-test-output/*.log
          if-no-files-found: warn
          retention-days: 14
